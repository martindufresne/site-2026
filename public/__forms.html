<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaires Netlify</title>
</head>
<body>
    <form name="pre-registration" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="hidden" name="form-name" value="pre-registration" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="course" />
        <input type="text" name="locale" />
        <input type="text" name="bot-field" />
    </form>
</body>
</html>
